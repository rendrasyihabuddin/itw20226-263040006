<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba CSS - Font Styling</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double:wght@100..900&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap');
        @font-face {
    font-family: 'LobsterTwo';
    src: url('fonts/LobsterTwo-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

.font-lobster {
    font-family: 'LobsterTwo', cursive;
}
        h1 {
            color: crimson;
            font-size: 60px;
            text-align: center;
            font-family: "Comic Sans MS", sans-serif;
        }

        p {
            color: navy;
            text-align: center;
            font-size: 30px;
            font-family: Lora, Helvetica, sans-serif;
        }

        .font-lobster {
            font-family: "Lobster Two", cursive;
        }

    </style>
</head>
<body>

    <h1>Hello World</h1>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Eveniet nulla perferendis in accusantium soluta numquam
        eos ex quae consequatur sed.
    </p>

    <p class="font-lobster">
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Eveniet nulla perferendis in accusantium soluta numquam
        eos ex quae consequatur sed.
    </p>

</body>
</html>
